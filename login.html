<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gastro-OS · Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: #F5F0E8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: #fff;
      border: 1px solid #D4AF37;
      border-radius: 8px;
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 4px 24px rgba(26,42,74,0.08);
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-title {
      font-size: 32px;
      font-weight: 700;
      color: #1A2A4A;
      letter-spacing: 2px;
    }

    .logo-title span {
      color: #D4AF37;
    }

    .logo-sub {
      font-size: 12px;
      letter-spacing: 4px;
      color: #9A7D3A;
      margin-top: 4px;
    }

    .divider {
      height: 1px;
      background: linear-gradient(to right, transparent, #D4AF37, transparent);
      margin: 20px 0 32px;
    }

    h2 {
      font-size: 20px;
      color: #1A2A4A;
      margin-bottom: 8px;
      text-align: center;
    }

    .subtitle {
      font-size: 14px;
      color: #666;
      text-align: center;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    label {
      display: block;
      font-size: 13px;
      color: #1A2A4A;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    input[type="email"] {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #D4AF37;
      border-radius: 4px;
      font-size: 15px;
      font-family: Georgia, serif;
      color: #1A2A4A;
      background: #FDFAF5;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="email"]:focus {
      border-color: #1A2A4A;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: #1A2A4A;
      color: #D4AF37;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      font-family: Georgia, serif;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover { background: #0D1B2A; }
    button:disabled { background: #ccc; color: #999; cursor: not-allowed; }

    .error-msg {
      margin-top: 16px;
      padding: 12px 16px;
      background: #FFF0F0;
      border: 1px solid #FFCCCC;
      border-radius: 4px;
      color: #CC0000;
      font-size: 13px;
      display: none;
    }

    .success-msg {
      margin-top: 16px;
      padding: 12px 16px;
      background: #F0FFF4;
      border: 1px solid #9AE6B4;
      border-radius: 4px;
      color: #276749;
      font-size: 13px;
      display: none;
    }

    .footer-note {
      margin-top: 28px;
      text-align: center;
      font-size: 12px;
      color: #999;
      line-height: 1.6;
    }

    .footer-note a {
      color: #9A7D3A;
      text-decoration: none;
    }
  
.btn-dashboard { background:#d4af37; color:#1a2a4a; border:none; padding:10px 22px; border-radius:6px; font-size:13px; font-weight:700; cursor:pointer; text-decoration:none; display:inline-block; transition:all 0.2s; }
.btn-dashboard:hover { background:#c8a030; color:#1a2a4a; }
.dashboard-row { text-align:right; margin-top:24px; padding:0 0 8px; }
</style>
</head>
<body>

<div class="login-card">
  <div class="logo">
    <div class="logo-title">Gastro<span>-OS</span></div>
    <div class="logo-sub">SYSTEM · STRATEGIE · ERFOLG</div>
  </div>

  <div class="divider"></div>

  <h2>Willkommen zurück</h2>
  <p class="subtitle">Gib deine E-Mail-Adresse ein, mit der du dein Gastro-OS Abonnement abgeschlossen hast.</p>

  <form id="loginForm" onsubmit="handleLogin(event)">
    <label for="email">E-MAIL-ADRESSE</label>
    <input type="email" id="email" placeholder="deine@email.de" required autocomplete="email"/>
    <button type="submit" id="submitBtn">EINLOGGEN</button>
  </form>

  <div class="error-msg" id="errorMsg"></div>
  <div class="success-msg" id="successMsg">✓ Zugang bestätigt. Du wirst weitergeleitet...</div>

  
<div class="footer-note">
    Noch kein Abonnement?
    <a href="https://whop.com/gastro-os" target="_blank">Jetzt Mitglied werden →</a>
  </div>
</div>

<script>
async function handleLogin(event) {
  event.preventDefault();

  const email = document.getElementById('email').value.trim();
  const btn = document.getElementById('submitBtn');
  const errorMsg = document.getElementById('errorMsg');
  const successMsg = document.getElementById('successMsg');

  // Reset
  errorMsg.style.display = 'none';
  successMsg.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'PRÜFE ZUGANG...';

  try {
    const response = await fetch('/api/check-auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });

    const data = await response.json();

    if (response.ok && data.success) {
      successMsg.style.display = 'block';
      setTimeout(() => {
        window.location.href = '/dashboard.html';
      }, 1200);
    } else {
      errorMsg.textContent = data.error || 'Zugang nicht möglich. Bitte überprüfe deine E-Mail.';
      errorMsg.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'EINLOGGEN';
    }
  } catch (err) {
    errorMsg.textContent = 'Verbindungsfehler. Bitte versuche es erneut.';
    errorMsg.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'EINLOGGEN';
  }
}
</script>

<script src="checklist-save.js"></script>
</body>
</html>
