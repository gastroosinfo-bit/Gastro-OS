<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Test</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#f5f0e8; padding:20px; font-family:Arial,sans-serif; }
h2 { color:#1a2a4a; margin-bottom:16px; }
.video-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 16/9;
  border-radius: 8px;
  overflow: hidden;
  background: #000;
  box-shadow: 0 4px 24px rgba(0,0,0,0.18);
}
.video-wrap iframe {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  border: none;
}
</style>
</head>
<body>
<h2>🎬 YouTube Test — Modul 0 Ankervideo</h2>
<div class="video-wrap">
  <iframe src="https://www.youtube.com/embed/q7R-7dVuCw4" 
    allow="autoplay; fullscreen; accelerometer; gyroscope; picture-in-picture" 
    allowfullscreen>
  </iframe>
</div>
<p style="margin-top:16px;color:#666;font-size:13px;">Teste: Play, Pause, Vollbild, 10s vor/zurück</p>
</body>
</html>
