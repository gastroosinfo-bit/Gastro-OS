<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temperaturen eintragen – GASTRO-OS</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Temperaturen">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<script>
  (function() {
    var code = new URLSearchParams(window.location.search).get('u');
    if (code) {
      document.write('<link rel="manifest" href="/api/manifest?type=temperaturen&code=' + encodeURIComponent(code) + '">');
    } else {
      document.write('<link rel="manifest" href="/manifest-temperaturen.json">');
    }
  })();
</script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',Arial,sans-serif; background:#f5f0e8; color:#1a2a4a; min-height:100vh; }
.header{background:#1a2a4a;padding:14px 40px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(0,0,0,0.3)}
.brand{font-family:Georgia,serif;font-size:20px;color:#d4af37;letter-spacing:3px;font-weight:normal}
.gold-bar { height:3px; background:linear-gradient(90deg,#1a2a4a,#d4af37,#1a2a4a); }
.wrap { max-width:560px; margin:0 auto; padding:28px 24px 60px; }
.tool-label { font-size:11px; color:#d4af37; letter-spacing:2px; text-transform:uppercase; font-weight:600; margin-bottom:4px; }
.tool-title { font-family:Georgia,serif; font-size:22px; color:#1a2a4a; margin-bottom:4px; }
.tool-sub { font-size:13px; color:#5a6a80; margin-bottom:20px; }

.section { background:#fff; border:1px solid #e8dfc8; border-radius:10px; padding:22px 26px; margin-bottom:20px; box-shadow:0 2px 6px rgba(0,0,0,0.04); }
.section-head { background:#1a2a4a; color:#d4af37; font-size:13px; font-weight:700; letter-spacing:1px; padding:10px 14px; border-radius:6px; margin-bottom:16px; }

.field-group { display:flex; flex-direction:column; gap:5px; margin-bottom:14px; }
.field-group label { font-size:11px; font-weight:700; color:#8090a8; text-transform:uppercase; letter-spacing:0.5px; }
.field-group input { border:1px solid #e0d8c8; border-radius:6px; padding:9px 10px; font-size:13.5px; color:#1a2a4a; background:#eaf2ff; font-family:inherit; width:100%; }
.field-group input:focus { outline:none; border-color:#d4af37; background:#fff; }
.grid2 { display:grid; grid-template-columns:1fr auto; gap:14px; align-items:end; }

.btn-add { background:#1a6640; color:#fff; border:none; padding:10px 20px; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; transition:all 0.2s; }
.btn-add:hover { background:#d4af37; color:#1a2a4a; }
.btn-add.secondary { background:transparent; color:#1a6640; border:1px solid #1a6640; }
.btn-add.secondary:hover { background:#1a6640; color:#fff; }
.save-msg { font-size:12px; color:#4aaa60; margin-left:10px; display:none; }
.error-msg { font-size:12.5px; color:#c0392b; margin-top:8px; display:none; }

.pin-screen { text-align:center; padding:40px 20px; }
.pin-input { font-size:24px; letter-spacing:8px; text-align:center; width:160px; padding:12px; border:2px solid #d4af37; border-radius:8px; margin:16px auto; display:block; }

.geraet-zeile { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid #f0e8d4; }
.geraet-zeile:last-child { border-bottom:none; }
.geraet-name { flex:1; font-size:13.5px; font-weight:600; }
.geraet-zeile input[type=number] { width:90px; text-align:center; }
.geraet-zeile label { display:flex; align-items:center; gap:6px; font-size:12px; color:#3a5578; white-space:nowrap; }

.footer-brand { background:#1a2a4a; margin-top:48px; padding:14px 40px; text-align:center; font-size:11px; color:#8090a8; letter-spacing:1px; }
.footer-brand strong { color:#d4af37; }
</style>
</head>
<body>

<div class="header">
  <span class="brand">GASTRO-OS</span>
</div>
<div class="gold-bar"></div>

<div class="wrap">
  <div class="tool-label">Toolbox · Intern</div>
  <div class="tool-title">🌡️ Temperaturen eintragen</div>
  <div class="tool-sub" id="tool-sub-text">Wird geladen …</div>

  <!-- ═══ PIN-EINGABE ═══ -->
  <div id="pin-screen" class="section pin-screen" style="display:none;">
    <div style="font-size:15px;margin-bottom:6px;">Bitte PIN eingeben</div>
    <input type="password" inputmode="numeric" maxlength="4" class="pin-input" id="pin-input" placeholder="••••">
    <button class="btn-add" onclick="pinPruefen()">Entsperren</button>
    <div class="error-msg" id="pin-error">Falsche PIN, bitte nochmal versuchen.</div>
  </div>

  <!-- ═══ MITARBEITER-BEREICH ═══ -->
  <div id="mitarbeiter-bereich" style="display:none;">
    <div class="section">
      <div class="field-group" style="max-width:220px;"><label>Datum</label><input type="date" id="temp-datum"></div>
      <div class="section-head">Temperaturen</div>
      <div id="geraete-liste"></div>
      <div class="error-msg" id="keine-geraete">Noch keine Geräte angelegt — bitte den Chef, sie bei Tagesgeschäft → Temperaturen einzurichten.</div>
      <button class="btn-add" style="margin-top:16px;" onclick="temperaturenSpeichern()">💾 Speichern</button>
      <span class="save-msg" id="temp-save-msg">✓ Gespeichert</span>
    </div>
    <button class="btn-add secondary" onclick="mitarbeiterAbmelden()" style="font-size:11.5px;padding:6px 12px;">🚪 Abmelden</button>
  </div>

</div>

<div class="footer-brand"><strong>GASTRO-OS</strong> &nbsp;·&nbsp; System · Strategie · Erfolg</div>

<script>
function flashSaved(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.style.display = 'inline';
  setTimeout(() => { el.style.display = 'none'; }, 2000);
}
function heute() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

let tCode = null, tPin = null, tName = null, geraete = [];

const urlParams = new URLSearchParams(window.location.search);
const codeAusUrl = urlParams.get('u');
tCode = codeAusUrl || localStorage.getItem('gastroos_te_code');

if (!tCode) {
  document.getElementById('tool-sub-text').textContent = 'Dieser Link ist unvollständig — bitte den Chef nach dem richtigen Link fragen.';
} else {
  if (codeAusUrl) localStorage.setItem('gastroos_te_code', codeAusUrl);
  document.getElementById('temp-datum').value = heute();
  const gespeichertePin = localStorage.getItem('gastroos_team_pin');
  if (gespeichertePin) {
    pinPruefenMitWert(gespeichertePin, true);
  } else {
    zeigePinScreen();
  }
}

function zeigePinScreen() {
  document.getElementById('tool-sub-text').textContent = 'Gib deine persönliche PIN ein, um Temperaturen einzutragen.';
  document.getElementById('pin-screen').style.display = 'block';
  document.getElementById('pin-input').focus();
}

window.pinPruefen = function() {
  const pin = document.getElementById('pin-input').value.trim();
  if (pin.length !== 4) return;
  pinPruefenMitWert(pin, false);
};

async function pinPruefenMitWert(pin, stillLaden) {
  try {
    const res = await fetch('/api/buch-public', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: tCode, pin, bookType: 'temperaturen' })
    });
    if (!res.ok) {
      let fehlertext = 'Falsche PIN, bitte nochmal versuchen.';
      try { const fehlerDaten = await res.json(); if (fehlerDaten && fehlerDaten.error) fehlertext = fehlerDaten.error; } catch (e) {}
      if (!stillLaden) {
        const errEl = document.getElementById('pin-error');
        errEl.textContent = fehlertext;
        errEl.style.display = 'block';
      }
      else { zeigePinScreen(); }
      return;
    }
    const d = await res.json();
    tPin = pin;
    tName = d.meinName;
    geraete = d.geraete || [];
    localStorage.setItem('gastroos_team_pin', pin);
    document.getElementById('pin-screen').style.display = 'none';
    document.getElementById('pin-error').style.display = 'none';
    document.getElementById('tool-sub-text').textContent = 'Hallo, ' + (tName || '') + '! Trag hier die Temperaturen ein.';
    document.getElementById('mitarbeiter-bereich').style.display = 'block';
    renderGeraete();
  } catch (e) {
    if (!stillLaden) document.getElementById('pin-error').style.display = 'block';
  }
}

window.mitarbeiterAbmelden = function() {
  localStorage.removeItem('gastroos_team_pin');
  document.getElementById('mitarbeiter-bereich').style.display = 'none';
  document.getElementById('pin-input').value = '';
  zeigePinScreen();
};

function renderGeraete() {
  const el = document.getElementById('geraete-liste');
  if (!geraete.length) {
    document.getElementById('keine-geraete').style.display = 'block';
    el.innerHTML = '';
    return;
  }
  el.innerHTML = geraete.map((g, idx) => `
    <div class="geraet-zeile">
      <div class="geraet-name">${g}</div>
      <input type="number" step="0.1" id="temp-wert-${idx}" placeholder="°C">
      <label><input type="checkbox" id="temp-ok-${idx}" checked> In Ordnung</label>
    </div>
  `).join('');
}

window.temperaturenSpeichern = async function() {
  const datum = document.getElementById('temp-datum').value;
  if (!datum) { alert('Bitte ein Datum wählen.'); return; }
  const werte = {};
  geraete.forEach((g, idx) => {
    const wertFeld = document.getElementById('temp-wert-' + idx);
    const okFeld = document.getElementById('temp-ok-' + idx);
    if (wertFeld && wertFeld.value !== '') {
      werte[g] = { temp: parseFloat(wertFeld.value), ok: okFeld.checked };
    }
  });
  if (!Object.keys(werte).length) { alert('Bitte mindestens eine Temperatur eintragen.'); return; }

  const res = await fetch('/api/buch-public', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code: tCode, pin: tPin, bookType: 'temperaturen', action: 'eintragen', datum, werte })
  });
  if (!res.ok) { alert('Speichern fehlgeschlagen.'); return; }
  flashSaved('temp-save-msg');
  geraete.forEach((g, idx) => {
    const wertFeld = document.getElementById('temp-wert-' + idx);
    if (wertFeld) wertFeld.value = '';
  });
};
</script>
</body>
</html>
