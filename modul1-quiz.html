
<script>
  const SUPABASE_URL = 'https://hchlganbgjeciwhwaisj.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_6nQgc9KSINQ1IHZXqeG5IQ_l-19-Fw3';
  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
  const RICHTIG = { 1:'A', 2:'B', 3:'B', 4:'C', 5:'A' };
  let antworten = {};
  let currentUser = null;

  async function init() {
    try {
      const res = await fetch('/api/verify-session');
      if (!res.ok) { window.location.href = 'login.html'; return; }
      const d = await res.json();
      if (!d.valid) { window.location.href = 'login.html'; return; }
      currentUser = { id: d.email, email: d.email };
    } catch(e) {
      window.location.href = 'login.html';
      return;
    }
    const { data } = await sb.from('user_tool_data').select('data').eq('user_id', currentUser.id).eq('tool_name', 'quiz_modul1').maybeSingle();
    if (data && data.data && data.data.bestanden) {
      document.getElementById('quiz-form').style.display = 'none';
      document.getElementById('bereits-box').style.display = 'block';
    }
  }

  function selectAnswer(frage, wert) {
    antworten[frage] = wert;
    document.querySelectorAll(`[name="q${frage}"]`).forEach(r => r.closest('.antwort-option').classList.remove('selected'));
    document.getElementById(`q${frage}${wert.toLowerCase()}`).checked = true;
    document.getElementById(`q${frage}${wert.toLowerCase()}`).closest('.antwort-option').classList.add('selected');
    if (Object.keys(antworten).length === 5) document.getElementById('submit-btn').disabled = false;
  }

  async function submitQuiz() {
    document.getElementById('submit-btn').disabled = true;
    let richtig = 0;
    for (let i = 1; i <= 5; i++) {
      const gew = antworten[i];
      const kor = RICHTIG[i];
      const opt = document.getElementById(`q${i}${gew.toLowerCase()}`).closest('.antwort-option');
      const fb = document.getElementById(`feedback-${i}`);
      if (gew === kor) {
        richtig++;
        opt.classList.add('correct');
        fb.textContent = '✓ Richtig!';
        fb.className = 'feedback correct';
      } else {
        opt.classList.add('wrong');
        document.getElementById(`q${i}${kor.toLowerCase()}`).closest('.antwort-option').classList.add('correct');
        fb.textContent = '✗ Leider falsch. Die richtige Antwort ist markiert.';
        fb.className = 'feedback wrong';
      }
      fb.style.display = 'block';
    }
    document.querySelectorAll('.antwort-option').forEach(o => o.style.pointerEvents = 'none');
    document.getElementById('submit-btn').style.display = 'none';

    if (richtig >= 4) {
      await sb.from('user_tool_data').upsert({
        user_id: currentUser.id,
        tool_name: 'quiz_modul1',
        data: { bestanden: true, richtig, datum: new Date().toISOString() },
        updated_at: new Date().toISOString()
      }, { onConflict: 'user_id,tool_name' });
      const { data: progData } = await sb.from('user_tool_data').select('data').eq('user_id', currentUser.id).eq('tool_name', 'modul_progress').maybeSingle();
      const progress = (progData && progData.data) ? progData.data : {};
      progress['1-9'] = true;
      await sb.from('user_tool_data').upsert({
        user_id: currentUser.id,
        tool_name: 'modul_progress',
        data: progress,
        updated_at: new Date().toISOString()
      }, { onConflict: 'user_id,tool_name' });
      document.getElementById('ergebnis-text').textContent = `Du hast ${richtig} von 5 Fragen richtig beantwortet. Ausgezeichnet!`;
      document.getElementById('ergebnis-bestanden').style.display = 'block';
      document.getElementById('ergebnis-bestanden').scrollIntoView({ behavior: 'smooth' });
    } else {
      document.getElementById('ergebnis-text-2').textContent = `Du hast ${richtig} von 5 Fragen richtig beantwortet. Du brauchst mindestens 4 richtige Antworten. Schau dir die Lektionen nochmal an!`;
      document.getElementById('ergebnis-nochmal').style.display = 'block';
      document.getElementById('ergebnis-nochmal').scrollIntoView({ behavior: 'smooth' });
    }
  }

  function retryQuiz() { window.location.reload(); }
  init();
</script>
