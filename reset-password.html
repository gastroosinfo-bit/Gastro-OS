<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gastro-OS · Passwort zurücksetzen</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: #F5F0E8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: #fff;
      border: 1px solid #D4AF37;
      border-radius: 8px;
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 4px 24px rgba(26,42,74,0.08);
    }
    .logo { text-align: center; margin-bottom: 32px; }
    .logo-title { font-size: 32px; font-weight: 700; color: #1A2A4A; letter-spacing: 2px; }
    .logo-title span { color: #D4AF37; }
    .logo-sub { font-size: 12px; letter-spacing: 4px; color: #9A7D3A; margin-top: 4px; }
    .divider { height: 1px; background: linear-gradient(to right, transparent, #D4AF37, transparent); margin: 20px 0 32px; }
    h2 { font-size: 20px; color: #1A2A4A; margin-bottom: 8px; text-align: center; }
    .subtitle { font-size: 14px; color: #666; text-align: center; margin-bottom: 28px; line-height: 1.6; }
    label { display: block; font-size: 13px; color: #1A2A4A; margin-bottom: 6px; letter-spacing: 1px; }
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #D4AF37;
      border-radius: 4px;
      font-size: 15px;
      font-family: Georgia, serif;
      color: #1A2A4A;
      background: #FDFAF5;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 16px;
    }
    input:focus { border-color: #1A2A4A; }
    button {
      width: 100%;
      margin-top: 4px;
      padding: 14px;
      background: #1A2A4A;
      color: #D4AF37;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      font-family: Georgia, serif;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #0D1B2A; }
    button:disabled { background: #ccc; color: #999; cursor: not-allowed; }
    .error-msg {
      margin-top: 16px; padding: 12px 16px;
      background: #FFF0F0; border: 1px solid #FFCCCC;
      border-radius: 4px; color: #CC0000; font-size: 13px; display: none;
    }
    .success-msg {
      margin-top: 16px; padding: 12px 16px;
      background: #F0FFF4; border: 1px solid #9AE6B4;
      border-radius: 4px; color: #276749; font-size: 13px; display: none;
    }
    .invalid-box { text-align: center; padding: 24px 0; }
    .invalid-box p { color: #CC0000; font-size: 14px; margin-bottom: 16px; }
    .invalid-box a { color: #9A7D3A; font-size: 13px; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="logo">
    <div class="logo-title">Gastro<span>-OS</span></div>
    <div class="logo-sub">SYSTEM · STRATEGIE · ERFOLG</div>
  </div>
  <div class="divider"></div>

  <div id="formBox">
    <h2>Neues Passwort</h2>
    <p class="subtitle">Bitte lege jetzt dein neues Passwort fest.</p>
    <form id="resetForm" onsubmit="handleReset(event)">
      <label for="newPassword">NEUES PASSWORT</label>
      <input type="password" id="newPassword" placeholder="Mindestens 8 Zeichen" required minlength="8"/>
      <label for="confirmPassword">PASSWORT WIEDERHOLEN</label>
      <input type="password" id="confirmPassword" placeholder="Passwort bestätigen" required minlength="8"/>
      <button type="submit" id="resetBtn">PASSWORT SPEICHERN</button>
    </form>
    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>
  </div>

  <div id="invalidBox" class="invalid-box" style="display:none;">
    <p>Dieser Link ist ungültig oder abgelaufen.</p>
    <a href="/login.html">← Zurück zum Login</a>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const email = params.get('email');

  if (!token || !email) {
    document.getElementById('formBox').style.display = 'none';
    document.getElementById('invalidBox').style.display = 'block';
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('successMsg').style.display = 'none';
  }

  function showSuccess(msg) {
    const el = document.getElementById('successMsg');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('errorMsg').style.display = 'none';
  }

  async function handleReset(event) {
    event.preventDefault();
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const btn = document.getElementById('resetBtn');

    if (newPassword !== confirmPassword) {
      showError('Die Passwörter stimmen nicht überein.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'WIRD GESPEICHERT...';

    try {
      const response = await fetch('/api/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, token, password: newPassword }),
      });
      const data = await response.json();

      if (response.ok && data.success) {
        showSuccess('✓ Passwort gespeichert. Du wirst weitergeleitet...');
        setTimeout(() => { window.location.href = '/dashboard.html'; }, 1500);
      } else {
        showError(data.error || 'Fehler. Bitte fordere einen neuen Link an.');
        document.getElementById('formBox').style.display = 'none';
        document.getElementById('invalidBox').style.display = 'block';
      }
    } catch (err) {
      showError('Verbindungsfehler. Bitte versuche es erneut.');
      btn.disabled = false;
      btn.textContent = 'PASSWORT SPEICHERN';
    }
  }
</script>
</body>
</html>
