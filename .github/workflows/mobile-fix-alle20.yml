name: Mobile Fix - Alle 20 Tools Final

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Mobile CSS in alle 20 Tool-Dateien injizieren
        run: |
          python3 << 'PYEOF'
          import os, base64

          TOOL_FILES = [
            "modul1-score.html",
            "modul2-analyse.html",
            "modul2-marge.html",
            "modul3-einkauf.html",
            "modul3-lieferanten.html",
            "modul4-gewinn.html",
            "modul4-kostentreiber.html",
            "modul5-wochenplaner.html",
            "modul6-personalstruktur.html",
            "modul6-feedback.html",
            "modul7-effizienzcheck.html",
            "modul7-kostenanalyse.html",
            "modul8-tracker.html",
            "modul9-marketingplan.html",
            "modul9-aktionsplan.html",
            "modul10-tool.html",
            "modul10-tool-video.html",
            "modul11-reflexion.html",
            "modul11-sterne.html",
            "modul12-recruiting.html",
          ]

          MOBILE_CSS = base64.b64decode("").decode("utf-8")
          MARKER = "GASTRO-OS MOBILE FIX FINAL"

          fixed = skipped = errors = 0
          for filename in TOOL_FILES:
            if not os.path.exists(filename):
              print(f"FEHLER: {filename} nicht gefunden"); errors += 1; continue
            with open(filename, "r", encoding="utf-8") as f:
              content = f.read()
            # Alte Fix-Version ersetzen ODER neu einfügen
            if "GASTRO-OS MOBILE FIX" in content and MARKER not in content:
              # Alte Version raus, neue rein
              import re
              content = re.sub(r'/\* =+ GASTRO-OS MOBILE FIX.*?END MOBILE FIX.*?\*/', '', content, flags=re.DOTALL)
              content = content.replace("</style>", MOBILE_CSS + "\n</style>", 1)
              with open(filename, "w", encoding="utf-8") as f:
                f.write(content)
              print(f"Aktualisiert: {filename}"); fixed += 1
            elif MARKER in content:
              print(f"Uebersprungen (aktuell): {filename}"); skipped += 1
            elif "</style>" not in content:
              print(f"FEHLER kein style-tag: {filename}"); errors += 1
            else:
              content = content.replace("</style>", MOBILE_CSS + "\n</style>", 1)
              with open(filename, "w", encoding="utf-8") as f:
                f.write(content)
              print(f"Gefixt: {filename}"); fixed += 1

          print(f"Ergebnis: {fixed} gefixt/aktualisiert | {skipped} uebersprungen | {errors} Fehler")
          PYEOF

      - name: Committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.html
          git diff --staged --quiet || git commit -m "Mobile Fix v2: overflow-hidden Bug behoben"
          git push
