name: Mobile Fix - Responsive Scaling

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Responsive Mobile Fix injizieren
        run: |
          python3 << 'PYEOF'
          import os, re, base64

          TOOL_FILES = [
            "modul1-score.html", "modul2-analyse.html", "modul2-marge.html",
            "modul3-einkauf.html", "modul3-lieferanten.html", "modul4-gewinn.html",
            "modul4-kostentreiber.html", "modul5-wochenplaner.html",
            "modul6-personalstruktur.html", "modul6-feedback.html",
            "modul7-effizienzcheck.html", "modul7-kostenanalyse.html",
            "modul8-tracker.html", "modul9-marketingplan.html",
            "modul9-aktionsplan.html", "modul10-tool-video.html",
            "modul11-reflexion.html", "modul11-sterne.html", "modul12-recruiting.html"
          ]

          MOBILE_CSS = base64.b64decode("").decode("utf-8")

          fixed = skipped = errors = 0
          for filename in TOOL_FILES:
            if not os.path.exists(filename):
              print(f"FEHLER: {filename} nicht gefunden"); errors += 1; continue
            with open(filename, "r", encoding="utf-8") as f:
              content = f.read()
            content = re.sub(r'/\* =+ GASTRO-OS.*?END.*?=+ \*/', '', content, flags=re.DOTALL)
            content = re.sub(r'/\* =+ RESPONSIVE.*?END RESPONSIVE.*?=+ \*/', '', content, flags=re.DOTALL)
            if "</style>" not in content:
              print(f"FEHLER kein style-tag: {filename}"); errors += 1; continue
            content = content.replace("</style>", MOBILE_CSS + "\n</style>", 1)
            with open(filename, "w", encoding="utf-8") as f:
              f.write(content)
            print(f"Gefixt: {filename}"); fixed += 1

          print(f"Ergebnis: {fixed} gefixt | {skipped} uebersprungen | {errors} Fehler")
          PYEOF

      - name: Committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.html
          git diff --staged --quiet || git commit -m "Fix: Responsive scaling alle 19 Tools"
          git push
