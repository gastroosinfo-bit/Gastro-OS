name: Mobile Fix – Alle 20 Tools (Final)

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Mobile CSS in alle 20 Tool-Dateien injizieren
        run: |
          python3 - <<'EOF'
          import os

          TOOL_FILES = [
            "modul1-score.html",
            "modul2-analyse.html",
            "modul2-marge.html",
            "modul3-einkauf.html",
            "modul3-lieferanten.html",
            "modul4-gewinn.html",
            "modul4-kostentreiber.html",
            "modul5-wochenplaner.html",
            "modul6-personalstruktur.html",
            "modul6-feedback.html",
            "modul7-effizienzcheck.html",
            "modul7-kostenanalyse.html",
            "modul8-tracker.html",
            "modul9-marketingplan.html",
            "modul9-aktionsplan.html",
            "modul10-tool.html",
            "modul10-tool-video.html",
            "modul11-reflexion.html",
            "modul11-sterne.html",
            "modul12-recruiting.html",
          ]

          MOBILE_CSS = """
/* ========== GASTRO-OS MOBILE FIX FINAL (07.06.2026) ========== */
@media (max-width: 768px) {

  /* Header */
  .header { padding: 12px 16px; }
  .brand { font-size: 16px; letter-spacing: 2px; }
  .btn-back, .btn-back-modul, .back-btn { padding: 8px 14px; font-size: 12px; }

  /* Wrap / Main */
  .wrap, .main { padding: 16px 10px 48px; margin-top: 16px; }

  /* Action-Row: Buttons untereinander */
  .action-row { flex-direction: column; align-items: stretch; gap: 8px; }
  .action-row button, .action-row a { width: 100%; text-align: center; }

  /* Tabs horizontal scrollbar */
  .tabs { overflow-x: auto; -webkit-overflow-scrolling: touch; flex-wrap: nowrap; }
  .tab-btn { white-space: nowrap; padding: 10px 16px; font-size: 12px; }

  /* Tool-Hero */
  .tool-hero { padding: 16px 14px; }
  .tool-hero h1 { font-size: 16px; }
  .tool-hero p { font-size: 12px; }

  /* Sections */
  .section { overflow: hidden; }
  .section-head { padding: 10px 14px; font-size: 12px; flex-direction: column; align-items: flex-start; gap: 4px; }
  .section-head h2 { font-size: 12px; }

  /* Scroll-Hinweis über jeder Section mit Tabelle */
  .section::before {
    content: '\2190 nach rechts wischen \2192';
    display: block;
    text-align: center;
    font-size: 11px;
    color: #d4af37;
    background: #1a2a4a;
    padding: 4px 0;
    letter-spacing: 0.5px;
  }

  /* Alle Tabellen: scrollbar + Mindestbreite */
  table,
  .tool-table,
  .diag-table,
  .profile-table,
  .verlauf-table {
    display: block;
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    white-space: nowrap;
    min-width: 560px;
  }

  /* Zellinhalte dürfen umbrechen */
  table td, table th,
  .tool-table td, .tool-table th {
    white-space: normal;
    min-width: 80px;
  }

  /* Alle Grids auf 1 Spalte */
  .meta-grid,
  [class*="grid"],
  .field-row, .two-col, .three-col, .four-col {
    display: block !important;
    grid-template-columns: 1fr !important;
  }

  /* Inputs volle Breite */
  input[type=text],
  input[type=number],
  input[type=date],
  input[type=email],
  select,
  textarea,
  .tool-input,
  .rating-select,
  .tool-textarea {
    width: 100% !important;
    box-sizing: border-box;
    font-size: 12px;
  }

  /* Score-Box */
  .score-box { padding: 16px 12px; }
  .score-num { font-size: 40px; }
  .score-type { font-size: 17px; }

  /* Radio */
  .radio-opt { padding: 10px 10px; }
  .pts-badge { font-size: 10px; white-space: nowrap; }

  /* Fazit / Save / Nav */
  .fazit-grid { padding: 12px; }
  .save-row { flex-direction: column; align-items: stretch; }
  .save-btn { width: 100%; }
  .nav-row { flex-direction: column; gap: 8px; }
  .nav-btn { width: 100%; text-align: center; }

  /* Footer */
  .footer, .footer-brand { padding: 12px 16px; font-size: 10px; }
}
/* ========== END MOBILE FIX FINAL ========== */
"""

          fixed = 0
          skipped = 0
          errors = 0

          for filename in TOOL_FILES:
            if not os.path.exists(filename):
              print(f"FEHLER: {filename} nicht gefunden")
              errors += 1
              continue
            with open(filename, "r", encoding="utf-8") as f:
              content = f.read()
            if "GASTRO-OS MOBILE FIX" in content:
              print(f"Übersprungen (bereits gefixt): {filename}")
              skipped += 1
              continue
            if "</style>" not in content:
              print(f"FEHLER: kein </style> in {filename}")
              errors += 1
              continue
            content = content.replace("</style>", MOBILE_CSS + "\n</style>", 1)
            with open(filename, "w", encoding="utf-8") as f:
              f.write(content)
            print(f"Gefixt: {filename}")
            fixed += 1

          print(f"\nErgebnis: {fixed} gefixt | {skipped} übersprungen | {errors} Fehler")
          EOF

      - name: Committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.html
          git diff --staged --quiet || git commit -m "Mobile Fix Final: alle 20 Tool-Dateien"
          git push
