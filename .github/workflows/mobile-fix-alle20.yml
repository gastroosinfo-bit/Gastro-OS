name: Mobile Fix - Responsive Scaling

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Responsive Mobile Fix in alle 19 Tool-Dateien injizieren
        run: |
          python3 << 'PYEOF'
          import os, re

          TOOL_FILES = [
            "modul1-score.html", "modul2-analyse.html", "modul2-marge.html",
            "modul3-einkauf.html", "modul3-lieferanten.html", "modul4-gewinn.html",
            "modul4-kostentreiber.html", "modul5-wochenplaner.html",
            "modul6-personalstruktur.html", "modul6-feedback.html",
            "modul7-effizienzcheck.html", "modul7-kostenanalyse.html",
            "modul8-tracker.html", "modul9-marketingplan.html",
            "modul9-aktionsplan.html", "modul10-tool-video.html",
            "modul11-reflexion.html", "modul11-sterne.html", "modul12-recruiting.html"
          ]

          MOBILE_CSS = """
/* ===== GASTRO-OS RESPONSIVE FIX (08.06.2026) ===== */
html { font-size: clamp(12px, 3.5vw, 16px); }

@media (max-width: 600px) {
  .wrap, .main, .content-wrap, .page-wrap {
    padding: 16px 12px 60px !important;
    max-width: 100% !important;
  }
  .header { padding: 10px 14px !important; }
  .brand { font-size: 16px !important; letter-spacing: 1px !important; }
  .tool-title, h1 { font-size: clamp(16px, 5vw, 22px) !important; }
  .tool-label, .tool-lbl, .lektion-tag { font-size: 10px !important; }
  .tool-sub, .hint-bar { font-size: 12px !important; }

  .save-row, .btn-row, .action-row, .nav-row {
    flex-wrap: wrap !important;
    gap: 8px !important;
    flex-direction: column !important;
    align-items: stretch !important;
  }
  .btn-save, .btn-export, .btn-reset, .btn-back,
  .back-btn, .btn-back-modul, .btn-back { 
    padding: 8px 14px !important;
    font-size: 12px !important;
    width: 100% !important;
    text-align: center !important;
    box-sizing: border-box !important;
  }

  .tabs { overflow-x: auto !important; -webkit-overflow-scrolling: touch !important; flex-wrap: nowrap !important; }
  .tab-btn { white-space: nowrap !important; padding: 8px 12px !important; font-size: 12px !important; }

  .field-row, .lief-row, .gesamt-row, .mass-row,
  .meta-row, .quartal-grid, .week-row,
  .meta-grid, .two-col, .three-col, .four-col {
    display: flex !important;
    flex-direction: column !important;
    grid-template-columns: 1fr !important;
  }
  .field-input-wrap, .field-ziel, .field-status, .field-calc,
  .lief-pct, .gesamt-col:not(:first-child) {
    border-left: none !important;
    border-top: 1px solid #f0ece4 !important;
  }

  .table-scroll-wrap, .tab-content, .block {
    display: block !important;
    width: 100% !important;
    overflow-x: scroll !important;
    -webkit-overflow-scrolling: touch !important;
  }
  table { min-width: 480px !important; font-size: 12px !important; }
  thead th, td { padding: 7px 8px !important; font-size: 11px !important; }

  .meta-input, .field-input, .mass-input, .hebel-input,
  input[type=text], input[type=number], input[type=date],
  select, textarea {
    min-width: unset !important;
    width: 100% !important;
    font-size: 13px !important;
    box-sizing: border-box !important;
  }

  .score-grid, .kpi-grid { grid-template-columns: 1fr 1fr !important; }
  .block, .tab-content, .card, .quartal-card { padding: 14px 12px !important; }
  .footer-brand, .footer { padding: 12px 14px !important; font-size: 10px !important; }
}
/* ===== END RESPONSIVE FIX ===== */
"""

          fixed = skipped = errors = 0
          for filename in TOOL_FILES:
            if not os.path.exists(filename):
              print(f"FEHLER: {filename} nicht gefunden"); errors += 1; continue
            with open(filename, "r", encoding="utf-8") as f:
              content = f.read()

            # Alle alten Fix-Versionen entfernen
            content = re.sub(r'/\* =+ GASTRO-OS.*?END.*?=+ \*/', '', content, flags=re.DOTALL)
            content = re.sub(r'/\* =+ RESPONSIVE.*?END RESPONSIVE.*?=+ \*/', '', content, flags=re.DOTALL)

            if "</style>" not in content:
              print(f"FEHLER kein style-tag: {filename}"); errors += 1; continue

            content = content.replace("</style>", MOBILE_CSS + "\n</style>", 1)

            with open(filename, "w", encoding="utf-8") as f:
              f.write(content)
            print(f"Gefixt: {filename}"); fixed += 1

          print(f"Ergebnis: {fixed} gefixt | {skipped} uebersprungen | {errors} Fehler")
          PYEOF

      - name: Committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.html
          git diff --staged --quiet || git commit -m "Fix: Responsive scaling alle 19 Tools"
          git push
